apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# SecureStack base manifests — deploy as a unit with:
#   kubectl apply -k k8s/base
# or point an ArgoCD Application at this path.
# Order below is documentation; kustomize applies namespaced resources
# after the namespace regardless.

resources:
  - namespace.yaml
  - rbac.yaml
  - network-policies.yaml
  - kyverno-policies.yaml
  - external-secrets.yaml
  - deployments.yaml
