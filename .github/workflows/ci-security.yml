name: SecureStack CI — Security Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  full-security:
    name: Full Security Gate
    uses: ./.github/workflows/full-security-scan.yml
    with:
      scan-path: "."
      has-docker: false
      has-terraform: false
      has-kubernetes: false
      run-dast: false
      has-ai: false
    secrets: inherit
