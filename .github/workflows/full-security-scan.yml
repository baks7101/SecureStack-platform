name: Full Security Scan (Reusable)

on:
  workflow_call:
    inputs:
      scan-path:
        description: 'Path to scan'
        required: false
        default: '.'
        type: string
      has-docker:
        description: 'Run container image scanning'
        required: false
        default: false
        type: boolean
      has-terraform:
        description: 'Run Terraform IaC scanning'
        required: false
        default: false
        type: boolean
      has-kubernetes:
        description: 'Run Kubernetes IaC scanning'
        required: false
        default: false
        type: boolean
      run-dast:
        description: 'Run DAST scanning'
        required: false
        default: false
        type: boolean
      has-ai:
        description: 'Run AI-BOM validation (repo declares AI components)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

jobs:

  # ─────────────────────────────────────────────
  # STAGE 1 — Secret Scanning
  # ─────────────────────────────────────────────
  secrets-scan:
    name: "Stage 1: Secret Scanning (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # STAGE 2 — SAST (CodeQL)
  # ─────────────────────────────────────────────
  sast-scan:
    name: "Stage 2: SAST (CodeQL)"
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql-sast

  # ─────────────────────────────────────────────
  # STAGE 3 — Semgrep (Base + AI Rules)
  # ─────────────────────────────────────────────
  semgrep-scan:
    name: "Stage 3: Semgrep (OWASP Top 10 + OWASP LLM Top 10)"
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - name: Checkout SecureStack rules
        uses: actions/checkout@v7
        with:
          repository: baks7101/SecureStack-platform
          path: securestack-rules
          ref: main

      - name: Checkout target repo
        uses: actions/checkout@v7
        with:
          path: target

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep with SecureStack rules
        run: |
          semgrep \
            --config securestack-rules/.semgrep/full-security-rules.yml \
            target/${{ inputs.scan-path }} \
            --sarif --output semgrep-results.sarif || true

      - name: Upload Semgrep SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep-full

      - name: Fail on ERROR severity findings
        run: |
          semgrep \
            --config securestack-rules/.semgrep/full-security-rules.yml \
            target/${{ inputs.scan-path }} --error

  # ─────────────────────────────────────────────
  # STAGE 4 — SCA (Trivy dependency scan)
  # ─────────────────────────────────────────────
  sca-scan:
    name: "Stage 4: SCA — Dependency Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy scan (table, fail on High/Critical)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ${{ inputs.scan-path }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          format: table

      - name: Run Trivy scan (SARIF for Security tab)
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: fs
          scan-ref: ${{ inputs.scan-path }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0
          format: sarif
          output: trivy-sca-results.sarif

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-sca-results.sarif
          category: trivy-sca

  # ─────────────────────────────────────────────
  # STAGE 5 — Dependency Pin Check
  # ─────────────────────────────────────────────
  dependency-pin-check:
    name: "Stage 5: Dependency Pin Check"
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check for unpinned dependencies
        run: |
          if [ -f "package.json" ]; then
            echo "Checking package.json for unpinned dependencies..."
            if grep -E '"[^"]+": "[\\^~]' package.json; then
              echo "FAIL: Unpinned dependencies found (^ or ~ prefix)"
              echo "All dependencies must be pinned to exact versions"
              echo "OWASP LLM05 - Supply Chain Vulnerability"
              exit 1
            else
              echo "PASS: All dependencies are pinned"
            fi
          fi
          if [ -f "requirements.txt" ]; then
            echo "Checking requirements.txt..."
            if grep -E '^[^=]+$|>=|<=' requirements.txt; then
              echo "FAIL: Unpinned Python dependencies found"
              exit 1
            else
              echo "PASS: All Python dependencies are pinned"
            fi
          fi

  # ─────────────────────────────────────────────
  # STAGE 6 — IaC Scanning (optional)
  # ─────────────────────────────────────────────
  iac-scan:
    name: "Stage 6: IaC Scan (Checkov)"
    runs-on: ubuntu-latest
    needs: secrets-scan
    if: ${{ inputs.has-terraform || inputs.has-kubernetes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Checkov
        run: pip install checkov

      - name: Scan Terraform
        if: ${{ inputs.has-terraform }}
        run: |
          checkov -d ./terraform \
            --framework terraform \
            --output sarif \
            --output-file-path checkov-terraform.sarif || true

      - name: Scan Kubernetes
        if: ${{ inputs.has-kubernetes }}
        run: |
          checkov -d ./k8s \
            --framework kubernetes \
            --output sarif \
            --output-file-path checkov-k8s.sarif || true

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('checkov-terraform.sarif') != ''
        with:
          sarif_file: checkov-terraform.sarif
          category: checkov-iac

  # ─────────────────────────────────────────────
  # STAGE 6b — OPA policy-as-code (Terraform, conftest)
  # ─────────────────────────────────────────────
  opa-policy:
    name: "Stage 6b: OPA Policy (conftest)"
    runs-on: ubuntu-latest
    needs: secrets-scan
    if: ${{ inputs.has-terraform }}
    steps:
      - name: Checkout SecureStack (for the rego policies)
        uses: actions/checkout@v7
        with:
          repository: baks7101/SecureStack-platform
          path: securestack-rules
          ref: main

      - name: Checkout target repo
        uses: actions/checkout@v7
        with:
          path: target

      - name: Install conftest
        run: |
          wget -q https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz
          tar xzf conftest_0.56.0_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/

      - name: Run OPA policy against Terraform
        run: |
          echo "Evaluating Terraform against SecureStack OPA policies..."
          conftest test target/ --policy securestack-rules/security/policies/opa --all-namespaces || true
          echo "Note: report-only for initial rollout (does not block yet)."

  # ─────────────────────────────────────────────
  # STAGE 7 — Container Image Scanning (optional)
  # ─────────────────────────────────────────────
  container-scan:
    name: "Stage 7: Container Image Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: [sast-scan, sca-scan]
    if: ${{ inputs.has-docker }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Scan Dockerfile for misconfigurations and base-image issues
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: app/api/Dockerfile
          severity: CRITICAL,HIGH
          exit-code: 0
          format: table

  # ─────────────────────────────────────────────
  # STAGE 8 — CLAUDE.md Governance Check
  # ─────────────────────────────────────────────
  claude-md-check:
    name: "Stage 8: CLAUDE.md Governance Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check CLAUDE.md exists and is not empty
        run: |
          if [ ! -f "CLAUDE.md" ]; then
            echo "FAIL: CLAUDE.md not found"
            echo "Every repo using AI agents must have a CLAUDE.md"
            echo "governance file defining security rules for the agent"
            exit 1
          fi
          if [ ! -s "CLAUDE.md" ]; then
            echo "FAIL: CLAUDE.md exists but is empty"
            exit 1
          fi
          echo "PASS: CLAUDE.md exists"
          echo "Size: $(wc -c < CLAUDE.md) bytes"

  ai-bom-check:
    name: "Stage 9: AI-BOM Validation"
    runs-on: ubuntu-latest
    needs: secrets-scan
    if: ${{ inputs.has-ai }}
    steps:
      - name: Checkout SecureStack governance
        uses: actions/checkout@v7
        with:
          repository: baks7101/SecureStack-platform
          path: securestack-rules
          ref: main

      - name: Checkout target repo
        uses: actions/checkout@v7
        with:
          path: target

      - name: Validate AI-BOM against approved components
        run: |
          python3 securestack-rules/scripts/validate-ai-bom.py \
            target/ai-bom.json \
            securestack-rules/security/approved-ai-components.json

  # ─────────────────────────────────────────────
  # STAGE 10a — SBOM Generation (inventory)
  # ─────────────────────────────────────────────
  sbom-generate:
    name: "Stage 10: SBOM Generation (Syft)"
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - name: Checkout SecureStack (for the reusable action)
        uses: actions/checkout@v7
        with:
          repository: baks7101/SecureStack-platform
          path: securestack-rules
          ref: main

      - name: Checkout target repo
        uses: actions/checkout@v7
        with:
          path: target

      - name: Generate SBOM with Syft
        uses: ./securestack-rules/.github/actions/sbom-generate
        with:
          target: target
          scan-type: dir
          output-file: sbom.cdx.json
          artifact-name: sbom

  # ─────────────────────────────────────────────
  # STAGE 10b — SBOM Vulnerability Scan (the control)
  # ─────────────────────────────────────────────
  sbom-vuln-scan:
    name: "Stage 10b: SBOM Vulnerability Scan (Grype)"
    runs-on: ubuntu-latest
    needs: sbom-generate
    steps:
      - name: Download the SBOM produced by the previous job
        uses: actions/download-artifact@v4.1.3
        with:
          name: sbom-${{ github.sha }}

      - name: Install Grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan SBOM, fail on High or Critical
        run: |
          echo "Scanning the SBOM for known vulnerabilities..."
          grype sbom:sbom.cdx.json --fail-on high -o table

  # ─────────────────────────────────────────────
  # STAGE 11 — DAST (optional)
  # ─────────────────────────────────────────────
  dast-scan:
    name: "Stage 10: DAST (OWASP ZAP)"
    runs-on: ubuntu-latest
    needs: [security-gate]
    if: ${{ inputs.run-dast }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Start application
        run: |
          docker compose up -d --build
          echo "Waiting for app to be ready..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "App is ready"
              break
            fi
            echo "Attempt $i/30 — waiting 5s..."
            sleep 5
          done

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

      - name: Stop application
        if: always()
        run: docker compose down

  # ─────────────────────────────────────────────
  # STAGE 12 — Security Gate (final)
  # ─────────────────────────────────────────────
  security-gate:
    name: "Stage 11: Security Quality Gate"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - secrets-scan
      - sast-scan
      - semgrep-scan
      - sca-scan
      - dependency-pin-check
      - claude-md-check
      - iac-scan
      - container-scan
      - ai-bom-check
      - sbom-vuln-scan
    steps:
      - name: Evaluate stage results and notify
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          R_SECRETS: ${{ needs.secrets-scan.result }}
          R_SAST: ${{ needs.sast-scan.result }}
          R_SEMGREP: ${{ needs.semgrep-scan.result }}
          R_SCA: ${{ needs.sca-scan.result }}
          R_PIN: ${{ needs.dependency-pin-check.result }}
          R_IAC: ${{ needs.iac-scan.result }}
          R_CONTAINER: ${{ needs.container-scan.result }}
          R_CLAUDEMD: ${{ needs.claude-md-check.result }}
          R_AIBOM: ${{ needs.ai-bom-check.result }}
          R_SBOM: ${{ needs.sbom-vuln-scan.result }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          LINES=""
          FAILED=""
          status() {
            case "$2" in
              success)   ICON=":white_check_mark:" ;;
              skipped)   ICON=":heavy_minus_sign:" ;;
              failure)   ICON=":x:";       FAILED="$FAILED $1," ;;
              cancelled) ICON=":x:";       FAILED="$FAILED $1," ;;
              *)         ICON=":warning:"; FAILED="$FAILED $1," ;;
            esac
            LINES="$LINES$ICON $1"$'\n'
            echo "$ICON $1 ($2)"
          }
          status "Stage 1 Secret Scanning" "$R_SECRETS"
          status "Stage 2 SAST" "$R_SAST"
          status "Stage 3 Semgrep" "$R_SEMGREP"
          status "Stage 4 SCA" "$R_SCA"
          status "Stage 5 Dependency Pin" "$R_PIN"
          status "Stage 6 IaC Scan" "$R_IAC"
          status "Stage 7 Container Scan" "$R_CONTAINER"
          status "Stage 8 CLAUDE.md" "$R_CLAUDEMD"
          status "Stage 9 AI-BOM" "$R_AIBOM"
          status "Stage 10b SBOM Vuln Scan" "$R_SBOM"
          echo ""
          if [ -z "$FAILED" ]; then
            echo "All required stages passed."
            exit 0
          fi
          echo "SECURITY GATE FAILED. Failing stages:$FAILED"
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            TEXT=":rotating_light: *Security Gate FAILED*"$'\n\n'":package: *Repo:* $REPO"$'\n'":twisted_rightwards_arrows: *Branch:* $BRANCH"$'\n'":bust_in_silhouette: *Author:* $ACTOR"$'\n'":label: *Commit:* ${SHA:0:7}"$'\n\n'"$LINES"$'\n'":link: <$RUN_URL|View the run>"
            jq -n --arg t "$TEXT" '{text: $t}' > /tmp/slack.json
            curl -s -X POST -H 'Content-Type: application/json' --data @/tmp/slack.json "$SLACK_WEBHOOK_URL" || echo "Slack notification failed"
          else
            echo "No SLACK_WEBHOOK_URL configured, skipping notification"
          fi
          exit 1

      - name: Security gate passed
        run: |
          echo "===================================================="
          echo "   FULL SECURITY GATE: ALL REQUIRED CHECKS PASSED"
          echo "===================================================="
          echo "   Note: DAST (Stage 10) runs after this gate when enabled."
          echo "   PR is cleared for merge."
          echo "===================================================="
